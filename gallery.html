<style>
:root{
  --bg:#f7f4fc; --bg-2:#efeaf8; --card:#fff;
  --ink:#3f3557; --ink-soft:#6b6188; --ink-faint:#9a92b3; --line:#e3dcf2;
  --mint:#4fc3a1; --mint-bg:#e4f7f1;
  --apricot:#efa765; --apricot-bg:#fdf0e2;
  --lilac:#a486e8; --lilac-bg:#f0eafd;
  --slate:#a9b3c9; --slate-bg:#edf0f6;
  --shadow-s:0 1px 3px rgba(63,53,87,.06),0 3px 10px rgba(63,53,87,.05);
  --shadow-m:0 4px 14px rgba(63,53,87,.10),0 10px 30px rgba(63,53,87,.08);
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.7 Nunito,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:3rem 1.5rem 5rem}
header{text-align:center;margin-bottom:2rem}
.logo{width:46px;height:46px;border-radius:50%;margin:0 auto .8rem;background:linear-gradient(135deg,var(--lilac),var(--blush,#f2799f))}
h1{font:700 2.1rem/1.2 Fraunces,serif;margin:0 0 .3rem;letter-spacing:-.01em}
.sub{color:var(--ink-faint);font:500 .82rem/1.6 var(--mono);margin:0}

.gal-bar{display:flex;flex-wrap:wrap;gap:.7rem;align-items:center;justify-content:center;margin:1.6rem 0 1.2rem}
.gal-bar input{flex:0 1 320px;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:.62rem 1.05rem;font:400 .92rem Nunito,sans-serif;color:var(--ink);outline:none;transition:border-color .2s var(--ease)}
.gal-bar input:focus{border-color:var(--lilac)}
.gal-bar input::placeholder{color:var(--ink-faint)}
.pill{background:var(--lilac-bg);color:#7b52c8;font:700 .72rem/1 Nunito,sans-serif;padding:.42rem .8rem;border-radius:99px;white-space:nowrap}

.drop{border:2px dashed var(--line);border-radius:18px;padding:2.4rem 1.4rem;text-align:center;color:var(--ink-faint);background:var(--card);margin-bottom:1.6rem;transition:border-color .2s var(--ease),background .2s var(--ease)}
.drop.over{border-color:var(--lilac);background:var(--lilac-bg)}
.drop b{display:block;color:var(--ink);font:700 1rem Nunito,sans-serif;margin-bottom:.2rem}

.fam{background:var(--card);border-radius:20px;padding:1.1rem 1.25rem;box-shadow:var(--shadow-s);margin-bottom:1.1rem}
.fam-h{display:flex;align-items:baseline;gap:.65rem;padding-bottom:.7rem;border-bottom:1px solid var(--line);margin-bottom:.9rem}
.fam-h b{font:700 1.06rem Fraunces,serif}
.fam-h em{font-style:normal;color:var(--ink-faint);font-size:.82rem}
.fam-h .pill{margin-left:auto}

.sp{padding:.85rem 0;border-top:1px dashed var(--line)}
.sp:first-of-type{border-top:0;padding-top:0}
.sp-head{display:flex;align-items:center;gap:.6rem;margin-bottom:.7rem;flex-wrap:wrap}
.sp-id{font:700 .88rem/1 var(--mono);background:var(--bg-2);padding:.36rem .56rem;border-radius:8px;color:#6d5fa0}
.sp-known{font:700 1rem/1 Nunito,sans-serif;color:#8a63d8;background:var(--lilac-bg);padding:.34rem .62rem;border-radius:8px}
.dot-t{width:9px;height:9px;border-radius:50%;flex:0 0 auto;background:var(--slate)}
.dot-t[data-t=rig]{background:var(--mint)}
.dot-t[data-t=tex]{background:var(--apricot)}
.dot-t[data-t=art]{background:var(--lilac)}

.sp-imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:.7rem}
.tile{margin:0;border-radius:13px;overflow:hidden;background:var(--bg-2);aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;transition:transform .24s var(--ease),box-shadow .24s var(--ease)}
.tile.has{cursor:zoom-in}
.tile.has:hover{transform:translateY(-4px);box-shadow:var(--shadow-m)}
.tile img{width:100%;height:100%;object-fit:contain;display:block}
.tile.miss{border:1px dashed var(--line);background:transparent}
.tile figcaption{position:absolute;bottom:0;left:0;right:0;font:600 .64rem/1 Nunito,sans-serif;text-align:center;padding:.3rem;background:rgba(255,255,255,.86);color:var(--ink-soft)}
.tile.miss figcaption{position:static;background:none;color:var(--ink-faint)}

.lb{position:fixed;inset:0;background:rgba(40,32,60,.82);display:none;align-items:center;justify-content:center;z-index:50;padding:2rem;cursor:zoom-out}
.lb.on{display:flex}
.lb img{max-width:min(92vw,900px);max-height:86vh;border-radius:16px;background:var(--card)}
.lb span{position:absolute;bottom:1.4rem;left:0;right:0;text-align:center;color:#fff;font:600 .86rem var(--mono)}

footer{text-align:center;color:var(--ink-faint);font:500 .76rem/1.7 var(--mono);margin-top:2.6rem}
@media (max-width:600px){ .wrap{padding:2rem 1rem 3rem} h1{font-size:1.7rem} }
</style>

const KNOWN = new Set(Object.keys(NAMES));

const treeEl = document.getElementById('tree');
const bar = document.getElementById('bar');
const cnt = document.getElementById('count');
const q   = document.getElementById('q');
const drop = document.getElementById('drop');
const urls = {};
let loaded = 0;

function label(v){
  const b = [];
  if(v.v) b.push('var ' + v.v);
  if(v.t) b.push(v.t);
  return b.join(' \u00b7 ') || 'base';
}

function build(){
  treeEl.innerHTML = '';
  const term = q.value.trim().toLowerCase();
  let showing = 0;

  for(const fam of Object.keys(TREE).sort()){
    const sp = TREE[fam];
    const ids = Object.keys(sp).sort().filter(id =>
      !term || id.includes(term)
      || (NAMES[id] || '').toLowerCase().includes(term)
      || sp[id].some(v => (v.t || '').toLowerCase().includes(term)));
    if(!ids.length) continue;

    const box = document.createElement('div');
    box.className = 'fam';
    const n = ids.reduce((a, id) => a + sp[id].length, 0);
    showing += n;
    box.innerHTML = '<div class="fam-h"><b>Line ' + fam + '</b><em>' + ids.length
      + ' species</em><span class="pill">' + n + ' images</span></div>';

    for(const id of ids){
      const tier = CLS[id] || 'ref';
      const row = document.createElement('div');
      row.className = 'sp';
      const head = document.createElement('div');
      head.className = 'sp-head';
      head.innerHTML = '<span class="dot-t" data-t="' + tier + '"></span>'
                     + '<span class="sp-id">' + id + '</span>'
                     + (KNOWN.has(id) ? '<b class="sp-known">' + NAMES[id] + '</b>' : '');
      row.appendChild(head);

      const imgs = document.createElement('div');
      imgs.className = 'sp-imgs';
      for(const v of sp[id]){
        const t = document.createElement('figure');
        t.className = 'tile ' + (urls[v.f] ? 'has' : 'miss');
        if(urls[v.f]){
          const im = document.createElement('img');
          im.src = urls[v.f]; im.alt = v.f; im.loading = 'lazy';
          t.appendChild(im);
          t.onclick = () => show(urls[v.f], (NAMES[id] ? NAMES[id] + ' \u00b7 ' : '') + id + ' \u00b7 ' + label(v));
        }
        const c = document.createElement('figcaption');
        c.textContent = label(v);
        t.appendChild(c);
        imgs.appendChild(t);
      }
      row.appendChild(imgs);
      box.appendChild(row);
    }
    treeEl.appendChild(box);
  }
  if(cnt) cnt.textContent = loaded ? (loaded + ' loaded \u00b7 ' + showing + ' slots') : (showing + ' slots');
}

function show(src, cap){
  document.getElementById('lbimg').src = src;
  document.getElementById('lbcap').textContent = cap;
  document.getElementById('lb').classList.add('on');
}
document.getElementById('lb').onclick = e => e.currentTarget.classList.remove('on');
document.addEventListener('keydown', e => { if(e.key === 'Escape') document.getElementById('lb').classList.remove('on'); });
q.oninput = build;

const KEY = /ResearchBook_Enter_(\d{5,7}(?:_[A-Za-z]+)?)/i;
function addFiles(files){
  for(const f of files){
    const m = KEY.exec(f.name);
    if(!m) continue;
    if(!urls[m[1]]){ urls[m[1]] = URL.createObjectURL(f); loaded++; }
  }
  if(loaded){ bar.hidden = false; drop.hidden = true; }
  build();
}
drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = async e => {
  e.preventDefault(); drop.classList.remove('over');
  const out = [];
  for(const it of e.dataTransfer.items){
    const h = it.webkitGetAsEntry && it.webkitGetAsEntry();
    if(h) await walk(h, out); else { const f = it.getAsFile(); if(f) out.push(f); }
  }
  addFiles(out);
};
async function walk(entry, out){
  if(entry.isFile) return new Promise(r => entry.file(f => { out.push(f); r(); }));
  const rd = entry.createReader();
  const items = await new Promise(r => rd.readEntries(r));
  for(const e of items) await walk(e, out);
}

async function bootArt(){
  try{
    const r = await fetch('art-manifest.json', {cache:'no-cache'});
    if(!r.ok) return false;
    const man = await r.json();
    let n = 0;
    if(Array.isArray(man)){ for(const k of man){ urls[k] = 'art/' + encodeURIComponent(k) + '.webp'; n++; } }
    else { for(const k of Object.keys(man)){ urls[k] = 'art/' + encodeURIComponent(man[k]); n++; } }
    if(!n) return false;
    loaded = n; bar.hidden = false; drop.hidden = true;
    return true;
  }catch(e){ return false; }
}

build();
bootArt().then(ok => { if(ok) build(); });
